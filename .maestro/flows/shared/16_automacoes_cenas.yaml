# [autenticado] Aba "Devices": automações e cenas (Scenes / Automation / Tap-to-Run).
appId: ${APP_ID}
tags:
  - autenticado
  - automacoes
  - regression
---
- runFlow: ../../subflows/open_app_logged.yaml
- tapOn: "Devices"
- assertVisible: "AUTOMATIONS"
- assertVisible: "Scenes"
