- assertVisible: "Tap-to-Run"
- takeScreenshot: "16_cenas"
# Aba Automation (estado vazio para um cômodo sem automações)
- tapOn: "Automation"
- assertVisible: "No item created"
- takeScreenshot: "16_automation"
