# [autenticado][i18n] Valida que o APP INTEIRO muda de idioma nos 4 idiomas.
# Para cada idioma confere: PERFIL (Account), HOME, AUTOMAÇÕES, CENAS e AMBIENTES
# (aba Devices). Troca em Account › App settings › App language.
#
# Notas:
# - Navegação inferior ("Account"/"Home"/"Devices") NÃO traduz — bons âncoras.
# - Itens de tela TRADUZEM → "App settings" é selecionado por regex multilíngue.
# - As bandeiras em App settings não têm accessibility label → tocadas por
#   coordenada em pixel (point x,y). Layout de referência: 1080x2400
#   (linha das bandeiras y=856 ; BR x=96 · US x=226 · ES x=356 · FR x=486).
# - Nomes de cenas/cômodos definidos pelo usuário (ex.: "Piscina apartamento")
#   NÃO traduzem — por isso só asseguramos rótulos do sistema.
appId: ${APP_ID}
tags:
  - autenticado
  - i18n
  - regression
---
- runFlow: ../../subflows/open_app_logged.yaml

# ---------- Português ----------
- tapOn: "Account"
- tapOn:
    text: "App settings|Configurações do App|Configuración de la app|Paramètres de l'app"
- tapOn:
    point: 96,856
- back
- assertVisible: "Sair da conta"            # perfil
- assertVisible: "Dados pessoais"
- tapOn: "Home"
- assertVisible: "Editar"                    # home
- tapOn: "Devices"
- assertVisible: "AUTOMAÇÕES"                 # automações (cabeçalho)
- assertVisible: "Cenas"                      # cenas
- assertVisible: "Automação"                  # automações (aba)
- assertVisible: "Selecione um ambiente"      # ambientes
- takeScreenshot: "20_app_pt"

